sonar.projectKey=nutrifood
sonar.projectName=NutriFood
sonar.sources=.
sonar.exclusions=node_modules/**,**/*.pyc,__pycache__/**,docs/**,.git/**,.scannerwork/**,web/defaults/**
sonar.javascript.file.suffixes=.js
sonar.python.file.suffixes=.py
sonar.html.file.suffixes=.html

# False positives — CSRF/CORS disabled by design (JWT Bearer tokens, not cookies)
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S8392
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e3.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.html
