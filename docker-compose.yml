services:
  nutrifood-api:
    build: ./backend
    container_name: nutrifood-api
    restart: unless-stopped
    volumes:
      - ./data:/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: .env
    environment:
      - DB_PATH=/data/nutrifood.db
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-2160}
      - APP_URL=${APP_URL:-https://slopvibe.org/nutri-food/}

  nutrifood-web:
    build: ./web
    container_name: nutrifood-web
    restart: unless-stopped
    ports:
      - "5011:80"
    depends_on:
      - nutrifood-api
