name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        env:
          JWT_SECRET: ci-test-secret-key-32bytes-long
          DB_PATH: /tmp/test_nf.db
          NF_DB_PATH: /tmp/test_nf.db
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app.py || true

      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r backend/app.py -ll || true
